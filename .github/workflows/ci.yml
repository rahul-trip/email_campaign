name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, so a new advisory shows up before deploy day
  workflow_call:  # the deploy workflow runs these checks first
    inputs:
      ref:
        description: Commit to check (the deploy workflow passes the one it ships)
        type: string
        default: ""

jobs:
  checks:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Import layers
        run: uv run lint-imports

  tests-sqlite:
    name: tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest

  tests-postgres:
    name: tests (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: outbound
          POSTGRES_PASSWORD: outbound
          POSTGRES_DB: outbound_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outbound"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://outbound:outbound@localhost:5432/outbound_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests

  web2:
    name: web2 app (types, build, generated client, browser test with the guided tour)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web2/package-lock.json
      - run: uv sync --frozen
      - run: npm ci
        working-directory: web2
      - name: Generated client matches the API
        working-directory: web2
        run: |
          npm run gen:api
          git diff --exit-code openapi.json src/api/schema.ts
      # typecheck covers the app and the browser tests; build is what the server serves.
      - run: npm run build
        working-directory: web2
      - run: npx playwright install --with-deps chromium
        working-directory: web2
      - run: npx playwright test
        working-directory: web2

  image:
    name: production image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Build the image the VM builds (deploy/compose.yml)
        run: docker build --pull -t outbound:ci .
      - name: The CLI starts inside it
        run: docker run --rm --entrypoint outbound outbound:ci --help

  security:
    name: security (secrets, dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0  # gitleaks reads the whole history
      - name: Secrets in the history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Known vulnerabilities in Python dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-project > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Known vulnerabilities in web2 dependencies
        working-directory: web2
        run: npm audit --audit-level=high

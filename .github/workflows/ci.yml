name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Import layers
        run: uv run lint-imports

  tests-sqlite:
    name: tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest

  tests-postgres:
    name: tests (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: outbound
          POSTGRES_PASSWORD: outbound
          POSTGRES_DB: outbound_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outbound"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://outbound:outbound@localhost:5432/outbound_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests

  web:
    name: web app (types, build, generated client, browser test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen
      - run: npm ci
        working-directory: web
      - name: Generated client matches the API
        working-directory: web
        run: |
          npm run gen:api
          git diff --exit-code openapi.json src/api/schema.ts
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web

  security:
    name: security (secrets, dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks reads the whole history
      - name: Secrets in the history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Known vulnerabilities in Python dependencies
        # PYSEC-2026-3740 (nltk, pulled in by textstat) has no fixed release yet; we only use
        # textstat's reading-grade formula and never load nltk data. Remove the ignore once a fix ships.
        run: |
          uv export --frozen --no-hashes --no-emit-project > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip --ignore-vuln PYSEC-2026-3740
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Known vulnerabilities in web dependencies
        working-directory: web
        run: npm audit --audit-level=high

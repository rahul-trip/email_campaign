# Added on top of compose.yml by deploy/local-test.sh, to rehearse a deploy on a laptop:
#   db     a local Postgres 16 in place of Supabase (POSTGRES_URL in the Doppler dev config)
#   proxy  Caddy with its own local certificate in place of the VM's proxy: https://localhost:8443
# Never used on the VM.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: outbound
      POSTGRES_PASSWORD: outbound  # local only; nothing outside this machine can reach it
      POSTGRES_DB: outbound
    volumes:
      - db:/var/lib/postgresql/data
      # Runs on a new volume only; after upgrading from an older rehearsal: local-test.sh reset
      - ./local-roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "outbound"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  # Extra settings for this laptop only: ${OUTBOUND_HOME}/local.env (git-ignored) holds the database
  # roles' URLs and SECRETS_KEYS, which Doppler's dev config does not carry (docs/DEPLOY.md, 5).
  # On an Apple M4 laptop also put OPENSSL_armcap=0 there, or Python dies with "Illegal instruction".
  migrate:
    env_file: [ "${OUTBOUND_HOME:-/opt/outbound}/doppler.env", "${OUTBOUND_HOME:-/opt/outbound}/local.env" ]
    depends_on:
      db: { condition: service_healthy }

  api:
    environment:
      ENVIRONMENT: local  # not "production": invitations and resets go to the log (no SMTP here)
    env_file: [ "${OUTBOUND_HOME:-/opt/outbound}/doppler.env", "${OUTBOUND_HOME:-/opt/outbound}/local.env" ]

  worker:
    environment:
      ENVIRONMENT: local
    env_file: [ "${OUTBOUND_HOME:-/opt/outbound}/doppler.env", "${OUTBOUND_HOME:-/opt/outbound}/local.env" ]

  proxy:
    image: caddy:2.8.4
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db:
  caddy:

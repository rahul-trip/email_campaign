[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["outbound"]

[project]
name = "outbound"
version = "0.0.1"
description = "Outbound B2B email engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "structlog>=24.1",
    "tldextract>=5.1",
    "uuid-utils>=0.9",
    "openpyxl>=3.1",
    "langgraph>=1.0.10,<2",
    "fastapi>=0.159.1",
    "uvicorn>=0.30",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "dnspython>=2.6",
    "psycopg[binary]>=3.2",  # Postgres in production (Supabase) and in CI
    "cryptography>=46",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-openpyxl>=3.1",
    "datasette>=0.65",  # read-only database viewer for Phases 1 and 2
    "import-linter>=2.15",
    "pytest-socket>=0.8.1",
]
# Dependencies of the legacy agent/ package; deleted together with it in Phase 2.
legacy = [
    "langgraph>=1.0.10,<2",
    "langchain-core>=1.2.22",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.scripts]
outbound = "outbound.cli.main:app"

[tool.uv]
default-groups = ["dev", "legacy"]

[tool.pytest.ini_options]
testpaths = ["tests", "agent"]
pythonpath = ["."]
# No test may use the network. Local connections (the throwaway Postgres, the test server) are
# allowed; anything else raises at once instead of quietly calling a vendor.
addopts = "-ra --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1,localhost"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["agent", "docs", "test_keys.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF", "S", "BLE", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"outbound.db.models".msg = "ORM rows stay inside outbound/db: repositories return entities."

[tool.ruff.lint.per-file-ignores]
"outbound/db/**" = ["TID251"]  # the database layer is where the models live
"outbound/db/migrations/versions/*" = ["E501"]  # frozen revisions hold long SQL strings
"tests/api/conftest.py" = ["F811"]  # fixtures imported from tests/db are used by name
"tests/*" = ["S101", "S104", "S105", "S106", "S311", "S608", "BLE001", "TID251"]  # asserts, fake secrets, test-only SQL on fixed table names
"scripts/*" = ["S101", "S105", "S106", "S311", "S603", "BLE001", "TID251"]  # dev tools: fake passwords, running pytest

[tool.mypy]
files = ["outbound", "tests", "scripts"]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgserver"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "outbound.domain.*"
strict = true

[tool.importlinter]
root_package = "outbound"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: imports only point down"
type = "layers"
# Highest first. A module may import from the layers below it, never from the ones above.
layers = [
    "outbound.cli",
    "outbound.api | outbound.worker",
    "outbound.pipeline",
    "outbound.services",
    "outbound.runner",
    "outbound.stages",
    "outbound.metering",
    "outbound.db | outbound.providers",
    "outbound.domain",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "The domain does no I/O and imports nothing from the other layers"
type = "forbidden"
source_modules = ["outbound.domain"]
forbidden_modules = [
    "outbound.db", "outbound.providers", "outbound.metering", "outbound.stages",
    "outbound.runner", "outbound.services", "outbound.api", "outbound.cli",
    "sqlalchemy", "httpx", "requests",
]

[[tool.importlinter.contracts]]
name = "Only directory and scheduling code reads across workspaces (Phase 6a)"
type = "forbidden"
source_modules = ["outbound.stages", "outbound.runner", "outbound.metering", "outbound.services"]
forbidden_modules = ["outbound.db.platform"]
# Seeding and creating a workspace, and the people who belong to them, are directory operations.
ignore_imports = [
    "outbound.services.seed -> outbound.db.platform",
    "outbound.services.workspaces -> outbound.db.platform",
    "outbound.services.admin -> outbound.db.platform",
    "outbound.services.vendors -> outbound.db.platform",
    "outbound.services.directory -> outbound.db.platform",
    "outbound.services.identity -> outbound.db.platform",
]

[[tool.importlinter.contracts]]
name = "Providers and the database do not depend on each other"
type = "independence"
modules = ["outbound.providers", "outbound.db"]
